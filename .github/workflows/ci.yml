name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # --root-dir must be an absolute path. Without it, every root-relative
      # link (/, /favicon.ico, ...) fails as "cannot resolve"; with it, they
      # resolve against the built output. lychee-action is a composite action
      # running on the runner, so github.workspace is the correct prefix.
      #
      # Three classes of link cannot be verified against a static directory and
      # are excluded via .lycheeignore, in the order they appear there:
      #   1. hips.hedera.com (the /standard redirect target) returns HTTP 403 to
      #      bot-like requests, a false alarm confirmed fine in a real browser.
      #   2. /meet is a Cloudflare edge redirect declared in public/_redirects,
      #      so no file for it is ever emitted into dist/.
      #   3. The whole https://itsbrandond.com/ origin. Canonical tags, the
      #      sitemap and llms.txt all point at the production domain, which
      #      still serves the old site and 404s these paths until the domain is
      #      cut over to this Worker. Scoped to the origin rather than to
      #      individual paths so that adding a page does not re-break CI.
      #      DELETE THIS ONE once the cutover is verified: after that it would
      #      silently stop checking every canonical and sitemap URL.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --root-dir "${{ github.workspace }}/dist" ./dist
          fail: true
