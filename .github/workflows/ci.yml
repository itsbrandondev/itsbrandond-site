name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      # hips.hedera.com (the /standard redirect target) returns HTTP 403 to
      # bot-like requests, a documented false alarm confirmed fine in a real
      # browser; excluded via .lycheeignore.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress ./dist
          fail: true
